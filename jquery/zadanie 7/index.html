<html>
<head>
    <title>Wprowadzenie jQuery</title>

    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <script>
        $(document).ready(function() {

            losujJablko();

            $(document).on("keydown", function(event) {

                if (event.key == "d") {
                    $('#kwadrat').css("left", "+=50px");
                }
                else if (event.key == "a") {
                    $('#kwadrat').css("left", "-=50px");
                }
                else if (event.key == "w") {
                    $('#kwadrat').css("top", "-=50px");
                }
                else if (event.key == "s") {
                    $('#kwadrat').css("top", "+=50px");
                }
                else if (event.key == "j") {
                    $('#kwadrat').css("background-color", "green");
                }

                sprawdzKolizje();
            });
        });


        function losujJablko() {

            let posX = Math.floor(Math.random() * 1000);
            let posY = Math.floor(Math.random() * 600);

            $('#jablko').css({
                "left": posX + "px",
                "top": posY + "px"
            });
        }


        function sprawdzKolizje() {

            let kwadrat = $('#kwadrat');
            let jablko = $('#jablko');

            let kwadratX = kwadrat.position().left;
            let kwadratY = kwadrat.position().top;

            let jablkoX = jablko.position().left;
            let jablkoY = jablko.position().top;

            let kwadratSzerokosc = kwadrat.outerWidth();
            let kwadratWysokosc = kwadrat.outerHeight();

            let jablkoSzerokosc = jablko.outerWidth();
            let jablkoWysokosc = jablko.outerHeight();

            if (
                kwadratX < jablkoX + jablkoSzerokosc &&
                kwadratX + kwadratSzerokosc > jablkoX &&
                kwadratY < jablkoY + jablkoWysokosc &&
                kwadratY + kwadratWysokosc > jablkoY
            ) {

                kwadrat.css({
                    "width": "+=50px",
                    "height": "+=50px"
                });

                losujJablko();
            }
        }
    </script>

    <style>

        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
            left: 0px;
            top: 0px;
        }

        #jablko {
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }

    </style>
</head>

<body>

    <div id="kwadrat"></div>
    <div id="jablko"></div>

</body>
</html>
